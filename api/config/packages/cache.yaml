framework:
    cache:
        pools:
            # Les réponses Riot (une game terminée ne change jamais) sont gardées sur disque.
            cache.riot:
                adapter: cache.adapter.filesystem
            # Faits de chaque game pour les stats : calculés une fois, la game ne change plus.
            cache.stats:
                adapter: cache.adapter.filesystem
            # Joueurs cherchés : gardé en mémoire le temps d'une requête, jamais écrit.
            cache.riot_live:
                adapter: cache.adapter.array

when@test:
    framework:
        cache:
            pools:
                cache.riot:
                    adapter: cache.adapter.array
                cache.stats:
                    adapter: cache.adapter.array
