# This file is the entry point to configure your own services.
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(RIOT_PLATFORM): 'euw1'
    env(RIOT_RATE_LIMITS): '20:1,100:120'
    env(DATABASE_PATH): '%kernel.project_dir%/var/challenger.db'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $riotPlatform: '@App\Riot\Platform'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Dto/'
            - '../src/Riot/Platform.php'
            - '../src/Riot/Exception/'

    App\Riot\Platform:
        factory: ['App\Riot\Platform', 'from']
        arguments: ['%env(RIOT_PLATFORM)%']

    App\Riot\RateLimiter:
        arguments: ['%env(RIOT_RATE_LIMITS)%']

    App\Riot\RiotApiClient:
        arguments:
            $httpClient: '@riot.client'
            $cache: '@cache.riot'

    App\Storage\MatchStore:
        arguments: ['%env(resolve:DATABASE_PATH)%']

when@test:
    services:
        App\Tests\Fixtures\FakeRiotApi: ~

        App\Storage\MatchStore:
            arguments: [':memory:']
